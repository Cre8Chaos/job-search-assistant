<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume</title>
  <style>
    /* ATS-SAFE: single column, no floats, no flex columns, no tables */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11pt;
      color: #000000;
      background: #ffffff;
      line-height: 1.4;
    }
    .resume {
      max-width: 8.5in;
      margin: 0 auto;
      padding: 0.65in 0.75in;
    }
    h1 { font-size: 20pt; font-weight: bold; margin-bottom: 4px; }
    .contact { font-size: 10pt; margin-bottom: 14px; color: #000; }
    h2 {
      font-size: 11pt;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1.5px solid #000000;
      padding-bottom: 2px;
      margin-top: 14px;
      margin-bottom: 6px;
    }
    h3 { font-size: 11pt; font-weight: bold; margin-bottom: 1px; }
    .job-meta { font-size: 10pt; color: #333; margin-bottom: 4px; }
    ul { margin: 3px 0 8px 18px; padding: 0; }
    li { margin-bottom: 2px; font-size: 11pt; }
    p { font-size: 11pt; margin-bottom: 6px; }
  </style>
</head>
<body>
<div class="resume">
{{RESUME_CONTENT}}
</div>
</body>
</html>
